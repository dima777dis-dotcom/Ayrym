<style>
:root{color-scheme:dark;--bg:#090e16;--surface:#101a28;--surface2:#142235;--surface3:#0c1521;--line:#24364c;--text:#eef4fc;--muted:#899bb1;--blue:#559dff;--blue2:#286bd8;--green:#36c98a;--shadow:0 18px 55px #0005}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1440px;margin:auto}.side{height:100vh;position:sticky;top:0;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;background:#0b121d}.brand{display:flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.2em;font-size:16px;padding:0 10px 26px}.mark{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,#6ab4ff,#2462cb);display:grid;place-items:center;font-size:20px;box-shadow:0 5px 20px #2876df44}.nav{display:grid;gap:6px}.nav button,.side-bottom button{border:0;background:transparent;color:#91a2b8;border-radius:12px;padding:12px;display:flex;align-items:center;gap:13px;text-align:left;font-weight:650}.nav button.active{background:#172b43;color:#8fc0ff}.nav svg,.side-bottom svg,.topbtn svg,.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.nav .count{margin-left:auto;border-radius:20px;background:#234d7c;color:#bcdcff;padding:2px 7px;font-size:10px}.side-bottom{margin-top:auto;display:grid;gap:5px}.user-mini{border-top:1px solid var(--line);margin-top:12px;padding:16px 8px 0;display:flex;align-items:center;gap:10px}.mini-avatar,.avatar{border-radius:50%;background:linear-gradient(145deg,#428fdc,#1c3555);display:grid;place-items:center;font-weight:800;color:white}.mini-avatar{width:37px;height:37px}.user-mini small{display:block;color:var(--muted);font-size:11px}.main{min-width:0;min-height:100vh}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;background:#0b121deF;backdrop-filter:blur(18px);z-index:4}.page-title{font-size:18px;font-weight:780;letter-spacing:-.02em}.top-actions{display:flex;gap:9px}.topbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:#b9c9dc;display:grid;place-items:center}.content{padding:26px 28px 40px;max-width:1100px;margin:auto}.mobile-brand,.mobile-nav{display:none}.heading{font-size:24px;letter-spacing:-.04em;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 22px}.panel{background:linear-gradient(180deg,#121e2d,#0f1926);border:1px solid var(--line);border-radius:17px;overflow:hidden}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:17px}.search{flex:1;position:relative}.search input,.field input,.field textarea{width:100%;background:#0b1420;border:1px solid #293b52;border-radius:12px;padding:12px 14px;color:var(--text);outline:none}.search input:focus,.field input:focus,.field textarea:focus{border-color:var(--blue)}.pill{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 13px;color:#b9c9dc}.chat-layout{display:grid;grid-template-columns:minmax(270px,360px) minmax(0,1fr);min-height:590px}.chat-list{border-right:1px solid var(--line)}.list-head{padding:17px 16px 12px;font-weight:750}.chat-item{width:100%;display:flex;gap:12px;padding:13px 15px;border:0;border-top:1px solid #1d2b3d;background:transparent;text-align:left}.chat-item:hover,.chat-item.selected{background:#17283c}.avatar{width:46px;height:46px;flex-shrink:0;font-size:15px}.chat-meta{min-width:0;flex:1}.chat-line{display:flex;justify-content:space-between;gap:8px}.chat-name{font-weight:720}.time{color:#70839b;font-size:10px;white-space:nowrap}.last{color:#8fa0b5;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{background:#2d75d2;border-radius:20px;padding:1px 7px;color:white;font-size:10px}.conversation{display:flex;flex-direction:column;min-width:0;min-height:590px}.conv-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}.conv-head small{display:block;color:var(--green);font-size:11px}.messages{flex:1;padding:20px;display:flex;flex-direction:column;gap:12px;overflow:auto;background:radial-gradient(ellipse at 50% 0%,#182a401c,transparent 60%)}.bubble{max-width:min(78%,470px);padding:11px 14px;border-radius:15px;background:#1a293b;color:#e6eef8;align-self:flex-start}.bubble.mine{align-self:flex-end;background:#205ba5}.bubble time{display:block;text-align:right;color:#b3cbe8;font-size:9px;margin-top:4px}.composer{padding:13px;border-top:1px solid var(--line);display:flex;gap:9px}.composer input{min-width:0;flex:1;background:#0b1420;border:1px solid #293b52;border-radius:12px;padding:12px;color:var(--text)}.send{width:43px;border:0;border-radius:12px;background:var(--blue2);display:grid;place-items:center}.send svg{width:18px;stroke:white;fill:none;stroke-width:2}.empty{margin:auto;text-align:center;color:var(--muted);padding:30px}.empty strong{display:block;color:var(--text);font-size:16px;margin-bottom:5px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.channel,.feature{padding:18px}.channel-top{display:flex;gap:12px;align-items:center}.channel-icon{width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,#235a91,#18304d);display:grid;place-items:center;font-size:20px}.channel h3,.feature h3{margin:0;font-size:15px}.channel p,.feature p{color:var(--muted);font-size:12px;line-height:1.55}.channel-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:#8295ac;font-size:11px}.primary,.secondary{border:0;border-radius:11px;padding:10px 14px;font-weight:700}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white}.secondary{background:#1b2b40;color:#c8d9ed;border:1px solid #30445d}.ai-layout{max-width:760px;margin:auto}.ai-hero{text-align:center;padding:32px 20px 24px}.ai-orb{width:62px;height:62px;border-radius:22px;background:linear-gradient(145deg,#66b7ff,#275bc3);display:grid;place-items:center;margin:0 auto 15px;box-shadow:0 10px 35px #2674df55;font-size:27px}.ai-hero h2{font-size:26px;margin:0 0 7px}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:0 0 18px}.suggestions button{border:1px solid var(--line);background:var(--surface);color:#c5d5e8;text-align:left;padding:13px;border-radius:12px}.ai-log{min-height:230px;max-height:420px;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.ai-input{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line)}.ai-input textarea{flex:1;resize:none;min-height:46px;max-height:110px;background:#0b1420;border:1px solid #293b52;border-radius:12px;padding:12px;color:var(--text)}.profile-hero{height:155px;border-radius:18px;background:linear-gradient(120deg,#132b47,#17263c 55%,#0f1a2a);border:1px solid #29415e}.profile-card{padding:0 22px 22px}.profile-avatar{width:100px;height:100px;border-radius:50%;border:4px solid var(--surface);margin-top:-50px;font-size:30px}.profile-name{font-size:25px;font-weight:800;margin-top:12px}.username{color:#7eb8ff}.bio{color:#a9b8ca;margin:12px 0 20px}.info-row{display:flex;justify-content:space-between;gap:20px;padding:14px 16px;border-top:1px solid #203044}.info-row span:first-child{color:#8193aa}.settings-grid{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}.settings-menu{padding:8px}.settings-menu button{width:100%;border:0;background:none;color:#9aabc0;text-align:left;padding:12px;border-radius:10px}.settings-menu button.active{background:#192c43;color:#9bc8ff}.settings-body{padding:22px}.settings-body h2{font-size:19px;margin:0 0 5px}.setting-row{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:17px 0;border-bottom:1px solid #203044}.setting-row:last-child{border:0}.setting-row small{display:block;color:var(--muted);margin-top:4px}.switch{appearance:none;width:42px;height:24px;border-radius:20px;background:#34455a;position:relative;flex-shrink:0}.switch:checked{background:#2879d8}.switch:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:white;left:3px;top:3px;transition:.2s}.switch:checked:before{left:21px}.select{background:#0b1420;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#20344c;border:1px solid #3b5c80;padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:9}.toast.show{display:block}
@media(max-width:800px){.app{display:block;padding-bottom:75px}.side{display:none}.topbar{height:60px;padding:0 16px}.content{padding:20px 14px 30px}.mobile-brand{display:flex;align-items:center;gap:8px;font-weight:850;letter-spacing:.16em}.mobile-brand .mark{width:31px;height:31px}.chat-layout{grid-template-columns:1fr;min-height:0}.chat-list{border-right:0}.conversation{display:none;position:fixed;inset:0;z-index:8;background:var(--bg);min-height:100vh}.conversation.open{display:flex}.conversation .conv-head{padding-top:18px}.cards{grid-template-columns:1fr}.settings-grid{grid-template-columns:1fr}.settings-menu{display:flex;overflow:auto}.settings-menu button{white-space:nowrap;width:auto}.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:7;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 7px max(9px,env(safe-area-inset-bottom));background:#0b121df2;border-top:1px solid var(--line);backdrop-filter:blur(16px)}.mobile-nav button{border:0;background:none;color:#7f91a8;display:grid;justify-items:center;gap:4px;font-size:10px;padding:5px}.mobile-nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mobile-nav button.active{color:#83baff}.toolbar{flex-wrap:wrap}.toolbar .search{flex-basis:100%}.suggestions{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.heading{font-size:21px}.suggestions{grid-template-columns:1fr}.profile-card{padding-left:15px;padding-right:15px}}
body.light{color-scheme:light;--bg:#edf3fa;--surface:#fff;--surface2:#edf3fa;--surface3:#f7f9fc;--line:#d6e1ed;--text:#172338;--muted:#66788e;background:var(--bg);color:var(--text)}body.light .side,body.light .topbar,body.light .mobile-nav{background:#ffffffed}body.light .panel{background:#fff}body.light .search input,body.light .field input,body.light .field textarea,body.light .composer input,body.light .ai-input textarea{background:#f7f9fc;color:#172338}body.light .bubble{background:#e7eef7;color:#24364c}body.light .bubble.mine{background:#d7eaff;color:#183c66}body.light .settings-body,body.light .settings-menu{background:#fff}body.light .profile-hero{background:linear-gradient(120deg,#c9e1fb,#e0eafa)}
</style></head><body>
<div class="app">
<aside class="side"><div class="brand"><span class="mark">N</span>NEXUS</div><nav class="nav" id="sideNav">
<button data-page="chats" class="active"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3z"/></svg>Чаты<span class="count">3</span></button>
<button data-page="channels"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>Каналы</button>
<button data-page="ai"><svg viewBox="0 0 24 24"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>NEXUS AI</button>

</nav><div class="side-bottom"><button data-page="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13a7 7 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5L9 6a7 7 0 0 0-1.7 1L5 6 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5L5 18l2.3-1a7 7 0 0 0 1.7 1l.5 3h5l.5-3a7 7 0 0 0 1.7-1l2.4 1 2-3.5z"/></svg>Настройки</button></div><div class="user-mini"><div class="mini-avatar" id="miniAvatar">D</div><div><b id="miniName">Дмитрий</b><small id="miniUser">@dmitry_nexus</small></div></div></aside>
<main class="main"><header class="topbar"><div class="mobile-brand"><span class="mark">N</span>NEXUS</div><div class="page-title" id="topTitle">Чаты</div><div class="top-actions"><button class="topbtn" id="searchFocus" aria-label="Поиск"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button><button class="topbtn" id="gear" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13a7 7 0 0 0 0-2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5L9 6a7 7 0 0 0-1.7 1L5 6 3 9.5 5 11a7 7 0 0 0 0 2l-2 1.5L5 18l2.3-1a7 7 0 0 0 1.7 1l.5 3h5l.5-3a7 7 0 0 0 1.7-1l2.4 1 2-3.5z"/></svg></button></div></header>
<div class="content" id="view"></div></main></div>
<nav class="mobile-nav" id="mobileNav"><button data-page="chats" class="active"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3z"/></svg>Чаты</button><button data-page="channels"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h11"/></svg>Каналы</button><button data-page="ai"><svg viewBox="0 0 24 24"><path d="m12 2 2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"/></svg>AI</button><button data-page="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Профиль</button></nav><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let page='chats',activeChat=0,settingsTab='general',aiHistory=[],profile={name:'Дмитрий',user:'dmitry_nexus',bio:'На связи. Исследую новые идеи и создаю своё.',photo:''};
const chats=[
{id:0,name:'Александр',user:'@alex_dev',initial:'А',color:'linear-gradient(145deg,#3778b9,#203c62)',time:'20:41',last:'Давай обсудим идею завтра',unread:2,messages:[['Привет! Как продвигается проект?',false,'20:35'],['Хорошо, собираю интерфейс NEXUS.',true,'20:37'],['Выглядит интересно. Покажешь?',false,'20:41']]},
{id:1,name:'Команда NEXUS',user:'3 участника',initial:'N',color:'linear-gradient(145deg,#3269b8,#1d3152)',time:'19:18',last:'Ирина: отправила макет',unread:1,messages:[['Добро пожаловать в рабочий чат!',false,'19:10'],['Здесь обсуждаем разработку.',false,'19:18']]},
{id:2,name:'Мама',user:'личный чат',initial:'М',color:'linear-gradient(145deg,#a36b91,#563b68)',time:'Вчера',last:'Не забудь позвонить ❤️',unread:0,messages:[['Привет ❤️',false,'Вчера'],['Обязательно позвоню!',true,'Вчера']]},
{id:3,name:'Илья',user:'@ilya',initial:'И',color:'linear-gradient(145deg,#4c8b76,#254e4b)',time:'Пн',last:'Спасибо за помощь!',unread:0,messages:[['Спасибо за помощь!',false,'Пн']]},
{id:4,name:'Заметки',user:'Личное пространство',initial:'✦',color:'linear-gradient(145deg,#777f9c,#39445e)',time:'Вс',last:'Список идей для NEXUS',unread:0,messages:[['Список идей для NEXUS',true,'Вс']]}
];
const channels=[['NEXUS Updates','Официальные новости и обновления NEXUS.','12.4K','✦'],['Tech / Future','Технологии, разработки и идеи будущего.','8.2K','⌘'],['Design Notes','Дизайн, интерфейсы и вдохновение.','3.1K','◈'],['Daily Science','Коротко о науке и открытиях.','24K','⚛']];
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function go(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('topTitle').textContent=({chats:'Чаты',channels:'Каналы',ai:'NEXUS AI',profile:'Профиль',settings:'Настройки'})[p];render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('gear').onclick=()=>go('settings');
function render(){const v=$('view');if(page==='chats')renderChats(v);if(page==='channels')renderChannels(v);if(page==='ai')renderAI(v);if(page==='profile')renderProfile(v);if(page==='settings')renderSettings(v)}
function renderChats(v){v.innerHTML='<h1 class="heading">Твои разговоры.</h1><p class="sub">Личные сообщения и группы — всё в одном месте.</p><div class="toolbar"><div class="search"><input id="chatSearch" placeholder="Поиск по чатам и сообщениям"></div><button class="pill" id="newChat">＋ Новый чат</button></div><div class="panel chat-layout"><div class="chat-list"><div class="list-head">Все сообщения <span style="color:var(--muted);font-weight:400">· '+chats.length+'</span></div><div id="chatItems"></div></div><section class="conversation" id="conversation"><div class="empty"><strong>Выбери диалог</strong>Твои сообщения появятся здесь.</div></section></div>';
function fill(q=''){const list=$('chatItems');list.innerHTML='';chats.filter(c=>(c.name+c.last+c.user).toLowerCase().includes(q.toLowerCase())).forEach(c=>{const b=document.createElement('button');b.className='chat-item'+(c.id===activeChat?' selected':'');b.innerHTML='<div class="avatar" style="background:'+c.color+'">'+c.initial+'</div><div class="chat-meta"><div class="chat-line"><span class="chat-name">'+esc(c.name)+'</span><span class="time">'+c.time+'</span></div><div class="chat-line"><div class="last">'+esc(c.last)+'</div>'+(c.unread?'<span class="unread">'+c.unread+'</span>':'')+'</div></div>';b.onclick=()=>openChat(c.id);list.append(b)})}
fill();$('chatSearch').oninput=e=>fill(e.target.value);$('newChat').onclick=()=>toast('Поиск контактов появится после подключения сервера.');if(activeChat!==null)openChat(activeChat,false)}
function openChat(id,show=true){activeChat=id;const c=chats.find(x=>x.id===id);if(!c)return;const el=$('conversation');if(!el)return;el.classList.toggle('open',show&&innerWidth<=800);el.innerHTML='<div class="conv-head"><button class="topbtn backChats" style="display:none">‹</button><div class="avatar" style="width:39px;height:39px;background:'+c.color+'">'+c.initial+'</div><div><b>'+esc(c.name)+'</b><small>в сети</small></div></div><div class="messages" id="msgList"></div><form class="composer" id="composer"><input id="msgInput" placeholder="Написать сообщение…" autocomplete="off"><button class="send" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="m4 4 17 8-17 8 3-8zM7 12h14"/></svg></button></form>';const list=$('msgList');c.messages.forEach(m=>addBubble(list,m[0],m[1],m[2]));list.scrollTop=list.scrollHeight;$('composer').onsubmit=e=>{e.preventDefault();const inp=$('msgInput'),t=inp.value.trim();if(!t)return;c.messages.push([t,true,new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})]);c.last=t;c.time='сейчас';addBubble(list,t,true,'сейчас');list.scrollTop=list.scrollHeight;inp.value='';renderChatListOnly()};}
function addBubble(el,t,mine,time){const d=document.createElement('div');d.className='bubble'+(mine?' mine':'');d.innerHTML=esc(t)+'<time>'+time+'</time>';el.append(d)}
function renderChatListOnly(){const q=$('chatSearch')?.value||'';const list=$('chatItems');if(!list)return;list.innerHTML='';chats.filter(c=>(c.name+c.last+c.user).toLowerCase().includes(q.toLowerCase())).forEach(c=>{const b=document.createElement('button');b.className='chat-item'+(c.id===activeChat?' selected':'');b.innerHTML='<div class="avatar" style="background:'+c.color+'">'+c.initial+'</div><div class="chat-meta"><div class="chat-line"><span class="chat-name">'+esc(c.name)+'</span><span class="time">'+c.time+'</span></div><div class="last">'+esc(c.last)+'</div></div>';b.onclick=()=>openChat(c.id);list.append(b)})}
function renderChannels(v){v.innerHTML='<h1 class="heading">Каналы NEXUS.</h1><p class="sub">Публичные пространства, где можно следить за интересными темами.</p><div class="toolbar"><div class="search"><input id="channelSearch" placeholder="Найти канал"></div><button class="pill" id="createChannel">＋ Создать канал</button></div><div class="cards" id="channelCards"></div>';function fill(q=''){const root=$('channelCards');root.innerHTML='';channels.filter(c=>c[0].toLowerCase().includes(q.toLowerCase())).forEach((c,i)=>{const d=document.createElement('article');d.className='panel channel';d.innerHTML='<div class="channel-top"><div class="channel-icon">'+c[3]+'</div><div><h3>'+c[0]+'</h3><small style="color:var(--muted)">Публичный канал</small></div></div><p>'+c[1]+'</p><div class="channel-foot"><span>'+c[2]+' подписчиков</span><button class="primary follow" data-id="'+i+'">'+(localStorage.getItem('follow'+i)==='1'?'Вы подписаны':'Подписаться')+'</button></div>';root.append(d)});$('.follow').forEach(b=>b.onclick=()=>{const k='follow'+b.dataset.id;localStorage.setItem(k,localStorage.getItem(k)==='1'?'0':'1');fill($('channelSearch').value);toast(localStorage.getItem(k)==='1'?'Вы подписались на канал':'Подписка отменена')})}fill();$('channelSearch').oninput=e=>fill(e.target.value);$('createChannel').onclick=()=>toast('Создание каналов будет доступно после подключения серверной части.')}
function renderAI(v){v.innerHTML='<div class="ai-layout"><div class="ai-hero"><div class="ai-orb">✦</div><h2>NEXUS AI</h2><p class="sub">Твой интеллектуальный помощник внутри мессенджера.</p></div><div class="suggestions"><button>✧ Помоги придумать идею</button><button>⌘ Напиши текст</button><button>◈ Объясни сложную тему</button><button>↗ Составь план действий</button></div><div class="panel"><div class="ai-log" id="aiLog"><div class="bubble">Привет! Я NEXUS AI. Чем могу помочь?</div></div><form class="ai-input" id="aiForm"><textarea id="aiText" placeholder="Спроси о чём угодно…"></textarea><button class="send">➤</button></form></div><p class="sub" style="font-size:11px;text-align:center;margin-top:12px">Демо-режим: ответы имитируются локально. Для настоящего ИИ нужен API и сервер.</p></div>';const log=$('aiLog');$$('.suggestions button').forEach(b=>b.onclick=()=>{$('aiText').value=b.textContent.replace(/^\S+\s/,'');$('aiText').focus()});$('aiForm').onsubmit=e=>{e.preventDefault();const t=$('aiText').value.trim();if(!t)return;addBubble(log,t,true,'сейчас');$('aiText').value='';const reply='Я получил запрос: «'+t+'». В полноценной версии NEXUS AI сможет анализировать контекст и помогать с этой задачей. Сейчас это демонстрационный ответ — подключение языковой модели ещё не настроено.';setTimeout(()=>{addBubble(log,reply,false,'сейчас');log.scrollTop=log.scrollHeight},450);log.scrollTop=log.scrollHeight}}
function renderProfile(v){v.innerHTML='<div class="profile-hero"></div><section class="panel profile-card" style="border-top:0;border-radius:0 0 18px 18px"><div class="avatar profile-avatar" id="pAvatar">D</div><div class="profile-name" id="pName"></div><div class="username" id="pUser"></div><p class="bio" id="pBio"></p><button class="primary" id="editProfile">Редактировать профиль</button><div style="margin-top:22px"><div class="info-row"><span>Имя пользователя</span><b id="pInfoUser"></b></div><div class="info-row"><span>Номер телефона</span><b>Скрыт</b></div><div class="info-row"><span>Тип аккаунта</span><b>Личный</b></div></div></section><p class="sub" style="font-size:12px;margin-top:16px">Твой профиль NEXUS. Управляй информацией и приватностью в настройках.</p>';syncProfile();$('editProfile').onclick=()=>{const n=prompt('Имя',profile.name);if(n===null)return;const u=prompt('Username без @',profile.user);if(u===null)return;const bio=prompt('О себе',profile.bio);if(bio===null)return;profile={...profile,name:n.trim()||profile.name,user:u.trim().replace(/^@/,''),bio};localStorage.setItem('nexusUser',JSON.stringify(profile));syncProfile();toast('Профиль обновлён')}}
function syncProfile(){['miniName','pName'].forEach(id=>{if($(id))$(id).textContent=profile.name});['miniUser','pUser'].forEach(id=>{if($(id))$(id).textContent='@'+profile.user});if($('pInfoUser'))$('pInfoUser').textContent='@'+profile.user;if($('pBio'))$('pBio').textContent=profile.bio;if($('pAvatar'))$('pAvatar').innerHTML=profile.photo?'<img src="'+profile.photo+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">':profile.name[0].toUpperCase();$('miniAvatar').textContent=profile.name[0].toUpperCase()}
function renderSettings(v){v.innerHTML='<h1 class="heading">Настройки.</h1><p class="sub">Настрой NEXUS под себя — от приватности до уведомлений.</p><div class="settings-grid"><div class="panel settings-menu" id="settingsMenu"><button data-tab="general">⚙ Общие</button><button data-tab="privacy">◈ Приватность</button><button data-tab="notifications">♢ Уведомления</button><button data-tab="appearance">◐ Оформление</button><button data-tab="storage">▤ Данные и память</button><button data-tab="account">◎ Аккаунт</button></div><div class="panel settings-body" id="settingsBody"></div></div>';function tab(t){settingsTab=t;$$('#settingsMenu button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));const b=$('settingsBody');const toggle=(id,label,desc,on=true)=>'<div class="setting-row"><div>'+label+'<small>'+desc+'</small></div><input class="switch" type="checkbox" id="'+id+'" '+(on?'checked':'')+'></div>';if(t==='general')b.innerHTML='<h2>Общие настройки</h2><p class="sub">Основные параметры приложения.</p>'+toggle('enterSend','Отправка по Enter','Отправлять сообщение клавишей Enter')+toggle('preview','Предпросмотр ссылок','Показывать карточки ссылок в чатах')+toggle('animations','Анимации','Плавные переходы и эффекты');if(t==='privacy')b.innerHTML='<h2>Приватность и безопасность</h2><p class="sub">Контролируй, какую информацию видят другие.</p>'+toggle('phoneVisible','Показывать номер телефона','По умолчанию номер скрыт',false)+toggle('photoVisible','Фото профиля всем','Разрешить просмотр фото',true)+toggle('lastSeen','Показывать статус «был(а) в сети»','Видимость времени последнего посещения',true)+toggle('readReceipts','Отчёты о прочтении','Показывать отметку о прочтении',true)+'<div class="setting-row"><div>Активные сеансы<small>Управление устройствами, где выполнен вход</small></div><button class="secondary" id="sessions">Открыть</button></div>';if(t==='notifications')b.innerHTML='<h2>Уведомления</h2><p class="sub">Выбери, о чём NEXUS будет сообщать.</p>'+toggle('allNotif','Все уведомления','Главный переключатель')+toggle('messageNotif','Личные сообщения','Новые сообщения и ответы')+toggle('groupNotif','Группы и каналы','Упоминания и новые публикации')+toggle('soundNotif','Звуки','Звук входящих сообщений');if(t==='appearance')b.innerHTML='<h2>Оформление</h2><p class="sub">Выбери внешний вид приложения.</p><div class="setting-row"><div>Тема интерфейса<small>Тёмная, светлая или графитовая</small></div><select class="select" id="themeSelect"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="graphite">Графитовая</option></select></div>'+toggle('compact','Компактный список чатов','Больше диалогов на экране',false);$('themeSelect').value=localStorage.getItem('nexusTheme')||'dark';$('themeSelect').onchange=e=>setTheme(e.target.value);if(t==='storage')b.innerHTML='<h2>Данные и память</h2><p class="sub">Управляй локальными данными демонстрации.</p><div class="setting-row"><div>Кэш приложения<small>В этой демо-версии хранится только локально</small></div><button class="secondary" id="clearCache">Очистить</button></div><div class="setting-row"><div>Экспорт профиля<small>Скачать копию данных профиля</small></div><button class="secondary" id="export">Экспорт</button></div><div class="setting-row"><div>Сбросить демо-данные<small>Очистить локальные настройки и профиль</small></div><button class="secondary" id="reset">Сбросить</button></div>';if(t==='account')b.innerHTML='<h2>Аккаунт</h2><p class="sub">Управление учётной записью.</p><div class="setting-row"><div>Профиль<small>'+esc(profile.name)+' · @'+esc(profile.user)+'</small></div><button class="secondary" id="goProfile">Открыть</button></div><div class="setting-row"><div>Подключение номера<small>SMS-подтверждение пока не подключено</small></div><span style="color:#e7bd75">Демо</span></div><div class="setting-row"><div>Выйти из демо</div><button class="secondary" id="logout">Выйти</button></div>';b.querySelectorAll('input.switch').forEach(x=>{const k='nexusSetting_'+x.id;x.checked=localStorage.getItem(k)===null?x.checked:localStorage.getItem(k)==='1';x.onchange=()=>{localStorage.setItem(k,x.checked?'1':'0');toast('Настройка сохранена')}});if($('sessions'))$('sessions').onclick=()=>toast('Список устройств появится после подключения авторизации.');if($('clearCache'))$('clearCache').onclick=()=>{toast('Временный кэш очищен')};if($('export'))$('export').onclick=()=>{const blob=new Blob([JSON.stringify(profile,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nexus-profile.json';a.click()};if($('reset'))$('reset').onclick=()=>{if(confirm('Сбросить локальный профиль и настройки?')){localStorage.clear();location.reload()}};if($('goProfile'))$('goProfile').onclick=()=>go('profile');if($('logout'))$('logout').onclick=()=>toast('Демо-выход: серверной сессии пока нет.')}
$$('#settingsMenu button').forEach(x=>x.onclick=()=>tab(x.dataset.tab));tab(settingsTab)}
function setTheme(t){document.body.classList.toggle('light',t==='light');document.body.classList.toggle('graphite',t==='graphite');localStorage.setItem('nexusTheme',t);toast('Тема изменена')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('searchFocus').onclick=()=>{if(page!=='chats')go('chats');setTimeout(()=>$('chatSearch')?.focus(),30)};
try{const p=JSON.parse(localStorage.getItem('nexusUser')||'null');if(p)profile={...profile,...p}}catch(e){}const savedTheme=localStorage.getItem('nexusTheme');if(savedTheme==='light')document.body.classList.add('light');if(savedTheme==='graphite'){document.documentElement.style.setProperty('--bg','#151a22');document.documentElement.style.setProperty('--surface','#1b2430')}syncProfile();go('chats');
</script></body></html>
