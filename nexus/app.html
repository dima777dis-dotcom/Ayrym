}

/* NEXUS 30% visual redesign — richer surfaces, hierarchy and motion */
:root{--bg:#080f1b;--surface:#101c2b;--surface2:#16263a;--surface3:#0d1725;--line:#263c55;--text:#edf5ff;--muted:#91a5bd;--blue:#66adff;--blue2:#347fe5;--glass:rgba(17,31,48,.82);--glow:0 12px 36px rgba(32,105,190,.13)}
body{background:radial-gradient(ellipse at 72% -15%,rgba(46,116,190,.19),transparent 42%),radial-gradient(ellipse at -10% 55%,rgba(25,73,124,.12),transparent 38%),var(--bg)}
.app{max-width:1600px;grid-template-columns:264px minmax(0,1fr)}
.side{background:rgba(9,17,29,.94);border-right-color:#233b56;padding:24px 15px}
.brand{font-size:17px;letter-spacing:.24em;padding-bottom:30px}.mark{border-radius:13px;box-shadow:0 0 28px #3989ed55}
.nav{gap:7px}.nav button,.side-bottom button{min-height:48px;border-radius:13px;padding:0 14px;transition:.22s}
.nav button:hover,.side-bottom button:hover{background:#14263b;transform:translateX(2px)}
.nav button.active{background:linear-gradient(100deg,#1b416b,#132940);box-shadow:inset 3px 0 #6bb4ff;color:#f2f8ff}
.user-mini{margin-top:auto;border:1px solid #29415c;background:linear-gradient(120deg,#152b43,#101d2d);border-radius:16px;padding:12px}
.topbar{height:70px;padding:0 clamp(18px,3vw,38px);background:rgba(8,15,27,.78);border-bottom:1px solid rgba(54,83,115,.45)}
.page-title{font-size:15px;font-weight:750;letter-spacing:.01em}
.topbtn{width:40px;height:40px;border-radius:13px;background:#14243a;border:1px solid #29415d}
.content{padding:28px clamp(18px,3vw,40px) 50px;max-width:1400px;margin:auto}
.heading{font-size:clamp(25px,3vw,34px);letter-spacing:-.045em;margin:0 0 5px}
.sub{max-width:720px;color:#9aadc4}
.toolbar{margin:20px 0 16px;gap:12px}
.search{min-height:48px;border-radius:15px;background:#111f31;border:1px solid #2a405a;box-shadow:inset 0 1px #ffffff08}
.search:focus-within{border-color:#5ca7f5;box-shadow:0 0 0 3px #559dff18}
.search input{padding:0 15px}
.panel{border:1px solid rgba(54,83,115,.62);background:linear-gradient(145deg,rgba(19,34,52,.97),rgba(13,24,38,.98));border-radius:20px;box-shadow:var(--glow)}
.chat-layout{overflow:hidden;min-height:560px;grid-template-columns:minmax(280px,365px) minmax(0,1fr)}
.chat-list{background:rgba(12,23,37,.8)}
.list-head{padding:17px 18px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#9bb2cc}
.chat-item{padding:14px 16px;min-height:82px;border-bottom:1px solid rgba(47,69,94,.42)}
.chat-item:hover{background:#172a40}.chat-item.selected{background:linear-gradient(90deg,#1b3c5e,#14263a)}
.avatar{box-shadow:0 5px 16px #0003;border:1px solid #ffffff12}
.chat-name{font-size:14px;font-weight:720}.last{color:#9aadc2}
.conversation{background:radial-gradient(ellipse at 50% 0%,#18324e66,transparent 55%),#0c1725}
.conv-head{padding:13px 18px;border-bottom:1px solid #263c55;background:rgba(17,31,48,.9);backdrop-filter:blur(16px)}
.messages{gap:10px;padding:22px clamp(14px,3vw,34px);background-image:radial-gradient(#7ba6d00b .7px,transparent .7px);background-size:18px 18px}
.bubble{padding:11px 14px;border:1px solid #2a4058;border-radius:17px 17px 17px 5px;background:#17283c;max-width:min(76%,560px)}
.bubble.mine{border-radius:17px 17px 5px 17px;background:linear-gradient(140deg,#245d9d,#1b4778);border-color:#3c7bb8}
.composer{padding:13px 16px;background:rgba(14,26,41,.96);backdrop-filter:blur(16px)}
.composer input,.ai-input textarea{border-radius:14px;background:#0a1625;border:1px solid #2b425e;padding:13px 15px}
.send,.primary{border-radius:13px;background:linear-gradient(135deg,#5aaaff,#286bd0);box-shadow:0 7px 20px #246dca3d}
.pill,.secondary{border:1px solid #2d4865;background:#14263b;border-radius:13px;padding:10px 14px;color:#c6d9ee}
.pill.active{background:#1d4771;color:#fff;border-color:#4b91db}
.cards{grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.channel{padding:20px;border-radius:19px;background:linear-gradient(145deg,#172b42,#101e2e);min-height:210px;display:flex;flex-direction:column}
.channel p{line-height:1.65;color:#a9bad0;flex:1}
.channel-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#285b91,#17304c);box-shadow:0 8px 22px #0003}
.channel-foot{padding-top:13px;border-top:1px solid #2b4058}
.ai-layout{max-width:980px}
.ai-hero{min-height:235px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#285b91,#142941 48%,#0e1b2b 100%);box-shadow:0 20px 60px #06101f}
.ai-hero:before,.ai-hero:after{content:"";position:absolute;border:1px solid #8bc5ff1b;border-radius:50%;width:330px;height:330px;pointer-events:none;animation:nxOrbit 24s linear infinite}
.ai-hero:after{width:440px;height:440px;animation-direction:reverse;animation-duration:34s}
@keyframes nxOrbit{to{transform:rotate(360deg)}}
.ai-hero h2{font-size:30px;letter-spacing:-.05em;margin:10px 0 3px;z-index:1}.ai-hero .sub{z-index:1}
.ai-orb{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;font-size:31px;background:linear-gradient(145deg,#8bd0ff,#367fe1);box-shadow:0 0 0 9px #7bbcff18,0 12px 40px #438fff66;animation:nxFloat 4s ease-in-out infinite}
@keyframes nxFloat{50%{transform:translateY(-7px) rotate(4deg)}}
.suggestions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:15px 0}
.suggestions button{min-height:72px;text-align:left;padding:14px;border:1px solid #2b4663;background:linear-gradient(145deg,#172c44,#101e2f);border-radius:16px;color:#d4e7fb}
.ai-layout>.panel{padding:15px}
.ai-log{min-height:230px;max-height:430px;overflow:auto;padding:15px}
.ai-input{display:flex;gap:10px;padding:10px;border-top:1px solid #2a4059}.ai-input textarea{flex:1;min-height:48px;max-height:130px}
.profile-shell{overflow:hidden}.profile-hero{min-height:190px;padding:30px;background:radial-gradient(circle at 82% 25%,#6bb8ff55,transparent 27%),radial-gradient(circle at 15% 95%,#3475b655,transparent 42%),linear-gradient(120deg,#10243b,#1c4770 55%,#102037)}
.profile-card{padding:0 28px 28px}.profile-name{font-size:25px;font-weight:800}.profile-actions{margin:18px 0 24px}
.info-row{padding:17px 5px}.settings-grid{gap:16px;grid-template-columns:240px minmax(0,1fr)}
.settings-menu{padding:10px;height:max-content}.settings-menu button{border-radius:11px;margin:2px 0;border:0}
.settings-body{min-height:360px;background:linear-gradient(145deg,#14263a,#101d2d)}
.setting-row{padding:15px 2px;border-bottom:1px solid #2b4058}
.mobile-nav{background:rgba(9,18,30,.91);border:1px solid #2c4562;border-bottom:0;box-shadow:0 -10px 38px #0005;backdrop-filter:blur(22px)}
.mobile-nav button{min-height:56px}
.nx-section{border:1px solid #2b4561;border-radius:18px;background:linear-gradient(120deg,#142941,#101d2d);padding:15px 17px;margin:16px 0;display:flex;align-items:center;gap:13px;box-shadow:0 10px 30px #0002;animation:nxRise .38s both}
.nx-section .nx-symbol{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:grid;place-items:center;background:#245080;color:#c5e2ff;font-size:20px}
.nx-section b{display:block;font-size:13px}.nx-section small{display:block;color:#91a8c2;margin-top:3px;line-height:1.45}
.nx-section .nx-tail{margin-left:auto;color:#79baff;font-size:20px}
.nx-stories{display:flex;gap:13px;overflow:auto;padding:14px 2px 5px;margin:8px 0 5px;scrollbar-width:none}
.nx-story{min-width:66px;text-align:center;color:#9db1c8;font-size:10px}.nx-story i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 7px;border-radius:18px;background:linear-gradient(145deg,#2b73b4,#192f4b);border:2px solid #72baff88;font-style:normal;font-size:20px;box-shadow:0 6px 18px #0004}

const $=id=>document.getElementById(id),$$=selector=>Array.from(document.querySelectorAll(selector));let page='chats',activeChat=0,viewedUserId=null,settingsTab='general',aiHistory=[],profile={name:'Дмитрий',user:'dmitry_nexus',bio:'На связи. Исследую новые идеи и создаю своё.',photo:''};

{id:1,name:'Команда NEXUS',user:'3 участника',initial:'N',color:'linear-gradient(145deg,#3269b8,#1d3152)',time:'19:18',last:'Ирина: отправила макет',unread:1,messages:[['Добро пожаловать в рабочий чат!',false,'19:10'],['Здесь обсуждаем разработку.',false,'19:18']]},

function render(){const v=$('view');try{if(page==='chats')renderChats(v);else if(page==='channels')renderChannels(v);else if(page==='ai')renderAI(v);else if(page==='profile')renderProfile(v);else if(page==='userProfile')renderOtherProfile(v);else if(page==='settings')renderSettings(v)}catch(err){console.error('NEXUS render error:',err);v.innerHTML='<section class="panel" style="padding:22px;margin-top:20px"><h2>Не удалось открыть раздел</h2><p style="color:var(--muted)">Ошибка интерфейса: '+esc(err&&err.message?err.message:'неизвестная ошибка')+'</p><button class="primary" onclick="location.reload()">Перезагрузить</button></section>'}}
function renderChats(v){
v.innerHTML='<div class="messenger-page"><div class="messenger-heading"><div><h1 class="heading">Сообщения</h1><p class="sub">Все твои диалоги в одном месте</p></div><button class="compose-btn" id="newChat" aria-label="Новое сообщение"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div><div class="toolbar"><div class="search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input id="chatSearch" placeholder="Поиск"></div></div><div class="chat-filters" id="chatFilters"><button class="active" data-filter="all">Все <span>'+chats.length+'</span></button><button data-filter="personal">Личные</button><button data-filter="groups">Группы</button></div><div class="panel chat-layout"><div class="chat-list"><div id="chatItems"></div><div class="chat-empty" id="chatEmpty" hidden>Ничего не найдено</div></div></div></div><section class="conversation conversation-screen" id="conversation" aria-hidden="true"></section>';

}
fill();$('chatSearch').oninput=e=>fill(e.target.value);
$('chatFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$('chatFilters').querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));fill($('chatSearch').value)});

function renderOtherProfile(v){
const u=chats.find(x=>x.id===viewedUserId);if(!u){page='chats';render();return}
const username=String(u.username||u.user||('@'+String(u.name).toLowerCase().replace(/[^a-z0-9]+/g,'_'))).replace(/^@?/,'@');
